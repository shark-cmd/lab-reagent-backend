services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labstock-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=labstock
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - labstock

  mongo:
    image: mongo:7
    container_name: labstock-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - labstock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labstock-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - labstock

volumes:
  mongo_data:

networks:
  labstock:
    driver: bridge
